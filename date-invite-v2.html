<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffdbe7" />
  <title>Для тебя ❤️</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.8), transparent 35%),
        linear-gradient(145deg, #fff0f5, #ffd7e5 55%, #ffc6da);
      color: #2b2025;
      position: relative;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      transition: opacity .45s ease, transform .45s ease;
    }

    .screen.hidden {
      opacity: 0;
      transform: scale(.96);
      pointer-events: none;
    }

    .card {
      width: min(92vw, 430px);
      min-height: 520px;
      border-radius: 34px;
      padding: 42px 28px 34px;
      background: rgba(255,255,255,.77);
      box-shadow: 0 24px 70px rgba(126, 47, 78, .18);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.8);
    }

    .tiny-hearts {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .35;
      font-size: 20px;
    }

    .tiny-hearts span { position: absolute; }
    .tiny-hearts span:nth-child(1){left:10%;top:11%}
    .tiny-hearts span:nth-child(2){right:12%;top:17%}
    .tiny-hearts span:nth-child(3){left:16%;bottom:14%}
    .tiny-hearts span:nth-child(4){right:14%;bottom:11%}

    .art {
      font-size: 86px;
      line-height: 1;
      margin: 42px 0 24px;
      filter: drop-shadow(0 10px 18px rgba(255,74,125,.15));
    }

    h1 {
      margin: 0;
      font-size: clamp(29px, 7vw, 38px);
      line-height: 1.12;
      letter-spacing: -0.7px;
    }

    p {
      margin: 14px auto 0;
      max-width: 320px;
      color: #735c66;
      font-size: 17px;
      line-height: 1.45;
    }

    .buttons {
      margin-top: 34px;
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      min-height: 64px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 16px 25px;
      font-size: 17px;
      font-weight: 700;
      font-family: inherit;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    #yesBtn {
      background: linear-gradient(135deg,#ff4a7d,#ff2868);
      color: #fff;
      box-shadow: 0 12px 26px rgba(255,45,105,.28);
      min-width: 150px;
    }

    #yesBtn:active { transform: scale(.97); }

    #noBtn {
      background: rgba(255,255,255,.95);
      color: #70515e;
      border: 1px solid rgba(112,81,94,.16);
      min-width: 92px;
      z-index: 50;
      transition: left .16s ease, top .16s ease, transform .12s ease;
    }

    .yay {
      font-size: 96px;
      margin: 72px 0 18px;
      animation: pop .65s cubic-bezier(.2,1.5,.4,1);
    }

    @keyframes pop {
      0% { transform: scale(.3) rotate(-12deg); opacity: 0; }
      70% { transform: scale(1.12) rotate(4deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); }
    }

    .final-note {
      margin-top: 24px;
      display: inline-block;
      padding: 12px 18px;
      border-radius: 18px;
      background: #fff0f5;
      color: #b52c5a;
      font-weight: 700;
    }

    .heart {
      position: fixed;
      bottom: -30px;
      pointer-events: none;
      z-index: 100;
      animation: floatUp 2.8s ease-in forwards;
      font-size: 24px;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(.7) rotate(0); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translateY(-115vh) scale(1.3) rotate(30deg); opacity: 0; }
    }
  </style>
</head>

<body>
  <section class="screen" id="screen1">
    <div class="card">
      <div class="tiny-hearts">
        <span>♡</span><span>♡</span><span>♡</span><span>♡</span>
      </div>

      <div class="art">🐱💗🐱</div>
      <h1>Пойдёшь со мной<br>на свидание?</h1>
      <p>Есть только один правильный вариант ответа 😌</p>

      <div class="buttons">
        <button id="yesBtn">Да ❤️</button>
        <button id="noBtn">Нет</button>
      </div>
    </div>
  </section>

  <section class="screen hidden" id="screen2">
    <div class="card">
      <div class="tiny-hearts">
        <span>♡</span><span>♡</span><span>♡</span><span>♡</span>
      </div>

      <div class="yay">🥰</div>
      <h1>Урааа! ❤️</h1>
      <p>Я почему-то и не сомневался 😌<br><br>Тогда свиданию — быть.</p>
      <div class="final-note">Детали — за мной ✨</div>
    </div>
  </section>

<script>
(() => {
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const screen1 = document.getElementById('screen1');
  const screen2 = document.getElementById('screen2');

  let escapedOnce = false;

  function moveNoButton() {
    if (!escapedOnce) {
      const r = noBtn.getBoundingClientRect();
      noBtn.style.position = 'fixed';
      noBtn.style.left = r.left + 'px';
      noBtn.style.top = r.top + 'px';
      escapedOnce = true;
    }

    const pad = 18;
    const w = noBtn.offsetWidth;
    const h = noBtn.offsetHeight;
    const maxX = Math.max(pad, window.innerWidth - w - pad);
    const maxY = Math.max(pad, window.innerHeight - h - pad);

    let x, y, tries = 0;

    do {
      x = pad + Math.random() * (maxX - pad);
      y = pad + Math.random() * (maxY - pad);
      tries++;
    } while (
      tries < 20 &&
      Math.abs(x - noBtn.getBoundingClientRect().left) < 120 &&
      Math.abs(y - noBtn.getBoundingClientRect().top) < 90
    );

    noBtn.style.left = `${x}px`;
    noBtn.style.top = `${y}px`;
    noBtn.style.transform = `rotate(${(Math.random()*12)-6}deg)`;
  }

  // Телефон: кнопка убегает сразу при касании.
  ['touchstart', 'pointerdown'].forEach(evt => {
    noBtn.addEventListener(evt, e => {
      e.preventDefault();
      e.stopPropagation();
      moveNoButton();
    }, { passive: false });
  });

  // Компьютер: убегает при наведении.
  noBtn.addEventListener('mouseenter', moveNoButton);

  // Дополнительно: убегает, если курсор подошёл близко.
  document.addEventListener('mousemove', e => {
    const r = noBtn.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
    if (dist < 85) moveNoButton();
  });

  noBtn.addEventListener('click', e => {
    e.preventDefault();
    moveNoButton();
  });

  yesBtn.addEventListener('click', () => {
    screen1.classList.add('hidden');
    screen2.classList.remove('hidden');

    // Сердечки после "Да"
    const icons = ['❤️','💗','💕','💖'];
    for (let i = 0; i < 26; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'heart';
        el.textContent = icons[Math.floor(Math.random() * icons.length)];
        el.style.left = (5 + Math.random() * 90) + 'vw';
        el.style.fontSize = (18 + Math.random() * 18) + 'px';
        el.style.animationDuration = (2.2 + Math.random() * 1.5) + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 4000);
      }, i * 75);
    }
  });
})();
</script>
</body>
</html>
